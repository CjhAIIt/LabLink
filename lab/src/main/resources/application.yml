server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: aiit-lab-management-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lab_recruitment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:cjh041217}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

jwt:
  # 仅供本地开发使用的默认值。生产环境必须通过 JWT_SECRET 覆盖，
  # 否则 StartupSecurityValidator 会在 production 环境下拒绝启动。
  secret: ${JWT_SECRET:labRecruitmentSecretKey2023ForJWTTokenGenerationAndValidationThisIsASecureKey}
  expiration: 86400000

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}

judge:
  python-command: ${JUDGE_PYTHON_COMMAND:python}
  c-compiler-command: ${JUDGE_C_COMPILER_COMMAND:gcc}
  cpp-compiler-command: ${JUDGE_CPP_COMPILER_COMMAND:g++}
  java-compiler-command: ${JUDGE_JAVA_COMPILER_COMMAND:javac}
  java-command: ${JUDGE_JAVA_COMMAND:java}
  work-dir: ${JUDGE_WORK_DIR:./.judge-work}

gradpath:
  base-url: ${GRADPATH_BASE_URL:http://localhost:8080}
  ws-url: ${GRADPATH_WS_URL:ws://localhost:8080/ws/interview}

logging:
  level:
    org.springframework.security: INFO
    com.lab.recruitment: INFO
    org.springframework.web: INFO
  file:
    name: logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  security:
    # local 只告警；production 会在启动时强制校验密钥与 CORS 白名单，不满足直接拒绝启动。
    environment: ${APP_SECURITY_ENVIRONMENT:local}
    judge:
      # 在线判题会执行用户提交的代码，默认关闭。开启前请自行评估执行隔离方案。
      enabled: ${APP_JUDGE_ENABLED:false}
      timeout-seconds: ${APP_JUDGE_TIMEOUT_SECONDS:5}
      max-memory-mb: ${APP_JUDGE_MAX_MEMORY_MB:128}
      max-output-bytes: ${APP_JUDGE_MAX_OUTPUT_BYTES:65536}
  email-auth:
    from-name: 安徽信息工程学院实验室管理平台
    code-expire-minutes: 10
    resend-interval-seconds: 60
  seed:
    normalize-demo-data: true
  modules:
    forum:
      enabled: false
    growth-center:
      enabled: false
    written-exam:
      enabled: false
