[package]
name = "lablink"
version = "1.0.0"
description = "LabLink 高校实验室管理平台桌面端"
authors = ["LabLink"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82.0"

[lib]
name = "lablink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
